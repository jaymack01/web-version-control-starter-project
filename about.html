<!DOCTYPE html>
<html lang="en">
<head>
   <title>Bootstrap Example</title>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- Using Bootstrap 5 framework -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
       rel="stylesheet">

   <!-- Bootstrap JavaScript -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <!-- jQuery used to load the navbar -->
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <!-- Navbar gets added here -->
   <div id="nav-placeholder"></div>
  <div class="container-fluid">
  <h1>About Me</h1>
  <img src="https://i.pinimg.com/originals/ee/0c/53/ee0c53ebeb7549de4b6081af40987112.jpg" class="img-thumbnail" alt="Cinque Terre">
  <p> This is one of my favorite spidermans, I have loved spiderman for quite some time now. Here at Metro State I play for the Men's basketball team, and the link below is the link to our mens basketball team </p>
  </p>
<a href="https://roadrunnersathletics.com/sports/mens-basketball">Visit roadrunnersathletics</a>
  </div>
  <script>
       // Load only the #site-nav element from navbar.html
       $("#nav-placeholder").load("navbar.html #site-nav");
   </script>

</body>
</html>
