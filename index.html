<!DOCTYPE html>
<html lang="en">
<head>
   <title>Bootstrap Example</title>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- Using Bootstrap 5 framework -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
       rel="stylesheet">

   <!-- Bootstrap JavaScript -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <!-- jQuery used to load the navbar -->
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <!-- Navbar gets added here -->
   <div id="nav-placeholder"></div>
  <div class="container-fluid">
  <h1>Jumbotron Example</h1>
  <p>This is a picture of me playing at my last college in Emporia, Kansas</p>
  <h1>Hello, My name is Justin and welcome to my first webpage!</h1>
  <img src="https://images.sidearmdev.com/convert?url=https:%2f%2fdxbhsrqyrr690.cloudfront.net%2fsidearm.nextgen.sites%2femporia.sidearmsports.com%2fimages%2f2024%2f12%2f17%2fESUMBBvsSterlingMack.jpg&type=webp" class="rounded; img-fluid" alt="Cinque Terre"
  <p> Last year at Emporia State University I play about 14 minutes and average 4 points, 2 rebounds, and 2 assists while being very efficient!</p>
  <script>
       // Load only the #site-nav element from navbar.html
       $("#nav-placeholder").load("navbar.html #site-nav");
   </script>

</body>
</html>
